# FloodWatch showcase stack — one host (droplet), MongoDB stays on Atlas.
# Secrets come from /opt/floodwatch/.env (created by the deploy workflow).

services:

  # MQTT broker — the master nodes point here once you switch off the public
  # broker. For the demo with broker.emqx.io you may leave this stopped:
  #   docker compose stop mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  # Internal event bus between parser and API
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # MQTT -> MongoDB + Redis
  parser:
    build: ./parser
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # REST + SSE for the website / apps
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Showcase website — static + /api proxy on 80/443.
  # DOMAIN=:80 in .env = plain HTTP; set DOMAIN=<your.domain> once DNS points
  # here and Caddy obtains a Let's Encrypt certificate automatically.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mosquitto_data:
  caddy_data:
  caddy_config:
