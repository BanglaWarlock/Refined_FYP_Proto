# FloodWatch showcase — static site + API proxy on port 80 (HTTP for now).
# TLS needs a domain name; if one is added later, certbot --nginx or a
# Caddy swap can be layered on without touching the app.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST + SSE — HTTP/1.1 + no buffering, or the stream lags/frames break
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
